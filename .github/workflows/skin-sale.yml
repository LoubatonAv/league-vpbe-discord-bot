name: League Skin Sale Updates

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skin-sale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore skin sale state
        uses: actions/cache/restore@v4
        with:
          path: check/skin-sale/skin-sale-state.json
          key: skin-sale-state-${{ github.run_id }}
          restore-keys: |
            skin-sale-state-

      - name: Run skin sale checker
        run: npm run skin-sale
        env:
          SKIN_SALE_WEBHOOK_URL: ${{ secrets.SKIN_SALE_WEBHOOK_URL }}
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
          SEND_TO_DISCORD: "true"

      - name: Save skin sale state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: check/skin-sale/skin-sale-state.json
          key: skin-sale-state-${{ github.run_id }}
